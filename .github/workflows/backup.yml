name: Daily backup
on:
  schedule:
    - cron: '17 3 * * *'   # täglich 03:17 UTC (hält Supabase auch wach)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run backup
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Commit changes
        run: |
          git config user.name "kicker-backup-bot"
          git config user.email "actions@users.noreply.github.com"
          git add backup
          git diff --cached --quiet || git commit -m "chore: daily backup $(date -u +%F)"
          git push
